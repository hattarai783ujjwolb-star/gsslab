<!DOCTYPE html>
<html>
<head>
	
	<title>Registration Form</title>
</head>
<body>
<form method="post" action="submit.html">
	<fieldset>
		<legend>Student's Registration Form</legend>

		<label for="name">Name:</label>
		<input type="text" id="name"name="name" placeholder="Enter Name"> <br><br>

		<label for="address">Address:</label>
		<input type="text" id="address" name="address" placeholder="Enter Address"><br><br>

		<label for="phonenumber">Phone No:</label>
		<input type="tel"id="phonenumber" name="phonenumber" placeholder="Enter Phone Number"><br><br>

		<label for="email">Email:</label>
		<input type="email" id="email" name="email" placeholder="Enter Email"><br><br>

		<label for="gpa">SEE GPA:</label>
		<input type="number" id="gpa" name="gpa" placeholder="Enter see gpa" step="0.01"><br><br>

		<label for="faculty">Choose Your Faculty</label>
		<select name="faculty">
		<option value="science">Science</option>
		<option value="management">Management</option>
		<option value="arts">Arts</option> <br><br>
		</select><br><br>

		<label for="gender">Gender</label>
		<input type="radio" name="gender" value="male">Male 
		<input type="radio" name="gender" value="female">Female 
		<input type="radio" name="gender" value="others">Others <br><br>

		<label for="language">Language</label>
		<input type="checkbox" name="language" value="Nepali">Nepali
		<input type="checkbox" name="language" value="English">English
		<input type="checkbox" name="language" value="Hindi">Hindi <br><br>

		<label for="image">Image:</label>
		<input type="file" id="image"name="image"><br><br>

		<label for="aboutyourself">Write About Yourself</label><br>
		<textarea name="aboutyourself" rows="5" cols="40" placeholder="Write in 150 Words"></textarea><br><br>

		<input type="submit"  value="submit">
		<input type="reset" name="reset">








	</fieldset>
</form>
</body>
</html>
